services:
  - type: web
    name: yulya-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false
      - key: API_KEY_HMAC_SECRET
        sync: false
      - key: PREVIEW_TOKEN_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: yulya_studio

  - type: web
    name: yulya-frontend
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ORIGIN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

