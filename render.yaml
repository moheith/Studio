services:
  - type: web
    name: yulya-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false
      - key: API_KEY_HMAC_SECRET
        sync: false
      - key: PREVIEW_TOKEN_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: yulya_studio
      - key: GEMINI_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta
