services:
  - type: web
    name: yulya-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: PLAY_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false
      - key: API_KEY_HMAC_SECRET
        sync: false
      - key: PREVIEW_TOKEN_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: yulya_studio
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PRIVATE_BUCKET
        value: yulya-private
      - key: R2_PUBLIC_BUCKET
        value: yulya-public
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: yulya-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ORIGIN
        sync: false
      - key: VITE_PLAY_ORIGIN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

